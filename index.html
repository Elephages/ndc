<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width"><title>NDC Calculator</title><style>body{max-width:820px;margin:auto;padding:35px;background:#101827;color:#eef;font:16px system-ui}h1{color:#9ce5ff}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.c{padding:24px;background:#18243a;border:1px solid #405476;border-radius:18px}label{display:grid;gap:5px;color:#cdd8ed}input,select{padding:9px;background:#0e1522;color:#fff;border:1px solid #4c6289;border-radius:8px;font:inherit}output{display:block;margin-top:18px;padding:16px;background:#0c1930;border:1px solid #2787b8;border-radius:10px;font-size:1.2em}.sub{color:#abb9d3}.note{font-size:.8em;color:#abb9d3}</style><h1>NDC Damage Calculator</h1><p class=sub>Accurate four-stat formula with 16 random rolls.</p><div class=c><div class=g><label>Level<input id=l type=number value=5 min=1></label><label>Power<input id=p type=number value=40 min=0></label><label>Attack<input id=a type=number value=20 min=1></label><label>Defense<input id=d type=number value=20 min=1></label><label>STAB<select id=s><option value=1>None</option><option value=1.5 selected>1.5×</option></select></label><label>Type<select id=t><option value=0>0×</option><option value=.25>.25×</option><option value=.5>.5×</option><option value=1 selected>1×</option><option value=2>2×</option><option value=4>4×</option></select></label><label>Other modifier<input id=m type=number value=1 step=.01 min=0></label><label>Critical<select id=c><option value=1 selected>No</option><option value=1.5>1.5×</option></select></label><label>Burn<select id=b><option value=1 selected>No</option><option value=.5>0.5×</option></select></label></div><output id=o></output><p class=note>Base = floor(floor((floor(2×Level÷5+2)×Power×Attack÷Defense)÷50))+2. Minimum damage is 1 unless immune.</p></div><script>let $=x=>document.getElementById(x);function f(){let L=+l.value,P=+p.value,A=+a.value,D=+d.value,T=+t.value;if(!L||!P||!A||!D||!T)return o.textContent='Damage: 0 — immune or missing stat';let x=Math.floor(Math.floor(Math.floor(2*L/5+2)*P*A/D)/50)+2,z=s.value*T*m.value*c.value*b.value;o.textContent='Damage: '+Math.max(1,Math.floor(x*z*.85))+'–'+Math.max(1,Math.floor(x*z))+'  (16 rolls)'}document.querySelectorAll('input,select').forEach(x=>x.oninput=f);f()</script>
