<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="A Showdown-style damage calculator for the Novalings prototype rules: every roll, KO chance and modifier." />
    <title>Novalings Damage Calculator</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23e0532a'/%3E%3Cpath d='M9 24V8h3l8 10V8h3v16h-3l-8-10v10z' fill='%23ffffff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><h1>Novalings <span>Damage Calculator</span></h1></div>
      <span id="source-status" class="topbar-source" aria-live="polite">Loading battle data…</span>
    </header>

    <main id="app" class="page">
      <div class="boot" role="status"><span class="spinner"></span> Loading battle data…</div>
    </main>
    <noscript><p class="boot">This calculator needs JavaScript to run.</p></noscript>
    <script>
      // If a script can't start (for example a stale cached file after a deploy), say so instead of loading forever.
      addEventListener("error", function () {
        var boot = document.querySelector("#app > .boot");
        if (!boot) return;
        boot.textContent = "The calculator couldn't start. Try a hard refresh (Ctrl/Cmd + Shift + R).";
        boot.setAttribute("role", "alert");
        document.querySelector("#source-status").textContent = "Couldn't start";
      });
    </script>
    <script src="./config.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
